<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCHE LIGHT — 3D Pub Dartboard & Darts-Maths Trainer</title>
<style>
  :root {
    --slate-bg: #0c1016;
    --panel-bg: rgba(13, 17, 23, 0.84);
    --panel-solid: #11161e;
    --brass: #c9a15a;
    --brass-dim: #7f6537;
    --brass-bright: #e8c682;
    --chalk: #e8e1cf;
    --chalk-dim: #9e9786;
    --crimson: #b84239;
    --forest: #3c8c58;
    --ice: #7ba3c4;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--slate-bg);
    font-family: 'Georgia', 'Palatino Linotype', 'Times New Roman', serif;
    color: var(--chalk);
  }
  #stage-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: crosshair;
  }

  /* Minimal Pub-Authentic HUD */
  .hud-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 18px;
  }
  .hud-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; width: 100%;
  }
  .plate {
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid rgba(201, 161, 90, 0.34);
    box-shadow: 0 6px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(232,198,130,0.12);
    border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  .brand-plate {
    padding: 8px 13px; display: flex; flex-direction: column; gap: 5px;
    min-width: 205px;
  }
  .brand-row { display: flex; align-items: center; gap: 9px; }
  .brand-title {
    font-size: 15px; letter-spacing: 2.6px; color: var(--brass-bright);
    font-weight: 700; text-transform: uppercase;
  }
  .ghost-pill {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10px; letter-spacing: 0.9px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 99px; cursor: pointer;
    border: 1px solid rgba(123, 163, 196, 0.45);
    color: #b7d5ee; background: rgba(34, 52, 70, 0.55);
    transition: all 0.25s ease;
  }
  .ghost-pill:hover { filter: brightness(1.18); }
  .ghost-pill.active-player {
    border-color: rgba(201, 161, 90, 0.65);
    color: var(--brass-bright); background: rgba(94, 67, 25, 0.45);
  }
  .stage-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201, 161, 90, 0.28);
    color: var(--chalk); border-radius: 4px;
    padding: 5px 9px; font-family: inherit; font-size: 12px;
    text-align: left; cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
    transition: border-color 0.2s, background 0.2s;
  }
  .stage-btn:hover { border-color: var(--brass); background: rgba(201,161,90,0.12); }
  .stage-btn .caret { color: var(--brass); font-size: 10px; }

  /* Center Score & Prompt Plaque */
  .prompt-plate {
    padding: 6px 16px 7px; text-align: center; min-width: 280px; max-width: 480px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .prompt-meta {
    display: flex; align-items: center; gap: 10px; width: 100%;
    justify-content: center;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10.5px; letter-spacing: 1px; color: var(--chalk-dim);
    text-transform: uppercase;
  }
  .dart-icons { display: inline-flex; gap: 5px; align-items: center; }
  .dart-pip {
    width: 16px; height: 5px; border-radius: 2px 5px 5px 2px;
    background: linear-gradient(90deg, var(--crimson) 0 38%, var(--brass-bright) 38% 85%, #d9d9d9 85%);
    box-shadow: 0 0 6px rgba(232,198,130,0.35);
    transition: opacity 0.25s, transform 0.25s;
  }
  .dart-pip.spent { opacity: 0.18; transform: scaleX(0.8); box-shadow: none; }
  .rival-tag {
    padding: 1px 6px; border-radius: 3px; font-size: 10px;
    border: 1px solid rgba(184, 66, 57, 0.55); color: #f0a8a2;
    background: rgba(120, 32, 26, 0.35);
  }
  .rival-tag.safe {
    border-color: rgba(60, 140, 88, 0.45); color: #9fdcb4;
    background: rgba(26, 75, 44, 0.35);
  }
  .prompt-main {
    display: flex; align-items: baseline; justify-content: center; gap: 11px;
    line-height: 1.08;
  }
  .score-big {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 28px; font-weight: 700; color: var(--chalk);
    text-shadow: 0 2px 10px rgba(201,161,90,0.22);
    letter-spacing: 1px;
  }
  .prompt-task {
    font-size: 13.5px; color: var(--brass-bright); letter-spacing: 0.25px;
    max-width: 330px;
  }
  .timer-track {
    width: 100%; height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 99px; overflow: hidden; margin-top: 3px;
  }
  .timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--brass-dim), var(--brass-bright));
    transform-origin: left center; transition: background 0.2s;
  }
  .timer-fill.warn { background: linear-gradient(90deg, #b85b2c, #e5934c); }
  .timer-fill.urgent { background: linear-gradient(90deg, #9c2b23, #de5347); }

  /* Right Controls */
  .right-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .controls-row { display: flex; gap: 7px; align-items: center; }
  .hud-btn {
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid rgba(201, 161, 90, 0.36);
    color: var(--chalk); border-radius: 5px;
    padding: 7px 11px; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(4px);
    transition: all 0.18s ease;
  }
  .hud-btn:hover { border-color: var(--brass-bright); color: var(--brass-bright); background: rgba(34,28,18,0.88); }
  .hud-btn.active { border-color: var(--brass-bright); background: rgba(112, 82, 32, 0.45); color: var(--brass-bright); }
  .flow-plate {
    padding: 6px 12px; display: flex; align-items: center; gap: 12px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 11px;
  }
  .flow-val { color: var(--brass-bright); font-weight: 700; font-size: 13px; }
  .tier-badge {
    padding: 2px 6px; border-radius: 3px; font-size: 10px;
    border: 1px solid rgba(201,161,90,0.35); color: var(--chalk-dim);
  }
  .tier-badge.t1 { color: #b7d5ee; border-color: rgba(123,163,196,0.45); }
  .tier-badge.t2 { color: var(--brass-bright); border-color: rgba(201,161,90,0.6); }
  .tier-badge.t3 { color: #a7e4ba; border-color: rgba(60,140,88,0.6); }

  /* Bottom Status & Cue Strip */
  .hud-bottom {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px; width: 100%;
  }
  .sound-pill {
    pointer-events: auto;
    background: rgba(15, 19, 25, 0.78);
    border: 1px solid rgba(201,161,90,0.38);
    color: var(--chalk-dim); border-radius: 99px;
    padding: 5px 12px; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.6px; cursor: pointer;
    transition: all 0.2s;
  }
  .sound-pill:hover { color: var(--brass-bright); border-color: var(--brass-bright); }
  .sound-pill.on { color: var(--brass-bright); border-color: rgba(201,161,90,0.65); }

  .feedback-strip {
    flex: 1; max-width: 640px; margin: 0 auto;
    padding: 8px 16px; text-align: center;
    font-size: 14px; line-height: 1.35; color: var(--chalk);
    min-height: 38px; display: flex; align-items: center; justify-content: center;
    gap: 10px; transition: border-color 0.25s, background 0.25s;
  }
  .feedback-strip.ok { border-color: rgba(60, 140, 88, 0.75); background: rgba(16, 35, 24, 0.88); color: #cdebd7; }
  .feedback-strip.warn { border-color: rgba(184, 66, 57, 0.8); background: rgba(42, 16, 15, 0.9); color: #f5cbc7; }
  .feedback-strip.cue { border-color: rgba(201, 161, 90, 0.55); background: rgba(24, 21, 15, 0.88); color: #efe3c8; }
  .hover-bed {
    pointer-events: none;
    padding: 6px 11px; min-width: 116px; text-align: right;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 12px; color: var(--brass-bright);
  }
  .hover-bed span { color: var(--chalk-dim); font-size: 10px; display: block; text-transform: uppercase; }

  /* Compact Slate Numpad (shown only for numeric input modes) */
  .numpad-panel {
    position: fixed; right: 20px; bottom: 64px; z-index: 15;
    width: 208px; padding: 11px; display: none; flex-direction: column; gap: 8px;
  }
  .numpad-panel.visible { display: flex; }
  .numpad-display {
    background: rgba(6, 9, 12, 0.85);
    border: 1px solid rgba(201, 161, 90, 0.36);
    border-radius: 4px; padding: 7px 10px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 24px; text-align: right; color: var(--chalk);
    letter-spacing: 2px; min-height: 44px;
  }
  .numpad-display.placeholder { color: rgba(232, 225, 207, 0.28); font-size: 14px; line-height: 28px; letter-spacing: 0.5px; }
  .numpad-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .np-key {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(201,161,90,0.28);
    color: var(--chalk); border-radius: 4px; padding: 9px 0;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.12s;
  }
  .np-key:hover { background: rgba(201,161,90,0.2); border-color: var(--brass-bright); color: var(--brass-bright); }
  .np-key.enter { background: rgba(60, 140, 88, 0.35); border-color: rgba(60,140,88,0.75); color: #d1f2dc; }
  .np-key.del { background: rgba(184, 66, 57, 0.22); border-color: rgba(184,66,57,0.55); color: #f2b7b1; }

  /* Slide-Over Chalkboard Drawer (Stages & Mastery Ledger) */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(5, 8, 12, 0.62);
    z-index: 30; display: none; justify-content: flex-end;
    backdrop-filter: blur(2px);
  }
  .drawer-backdrop.open { display: flex; }
  .drawer {
    width: min(500px, 94vw); height: 100%;
    background: #10151c; border-left: 1px solid rgba(201, 161, 90, 0.42);
    box-shadow: -12px 0 40px rgba(0,0,0,0.72);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer-head {
    padding: 14px 18px; border-bottom: 1px solid rgba(201,161,90,0.25);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-tabs { display: flex; gap: 8px; }
  .dtab {
    background: transparent; border: 1px solid rgba(201,161,90,0.28);
    color: var(--chalk-dim); padding: 6px 12px; border-radius: 4px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer;
  }
  .dtab.active { background: rgba(201,161,90,0.2); color: var(--brass-bright); border-color: var(--brass-bright); }
  .drawer-close {
    background: transparent; border: 1px solid rgba(201,161,90,0.3);
    color: var(--chalk); width: 30px; height: 30px; border-radius: 4px;
    font-size: 16px; cursor: pointer;
  }
  .drawer-body {
    flex: 1; overflow-y: auto; padding: 16px 18px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 12px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(201,161,90,0.2);
    border-radius: 5px; font-size: 13px;
  }
  .seg-group { display: flex; gap: 4px; }
  .seg-btn {
    background: transparent; border: 1px solid rgba(201,161,90,0.28);
    color: var(--chalk-dim); padding: 4px 8px; border-radius: 3px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10px; cursor: pointer;
  }
  .seg-btn.active { background: rgba(201,161,90,0.25); color: var(--brass-bright); border-color: var(--brass-bright); }

  .stage-card {
    padding: 11px 13px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(201,161,90,0.22);
    display: flex; flex-direction: column; gap: 4px;
    transition: all 0.16s;
  }
  .stage-card:hover { border-color: var(--brass); background: rgba(201,161,90,0.09); }
  .stage-card.selected { border-color: var(--brass-bright); background: rgba(201,161,90,0.16); }
  .sc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sc-title { font-size: 14px; font-weight: 700; color: var(--brass-bright); }
  .sc-tag {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10px; color: var(--chalk-dim); padding: 2px 6px;
    border-radius: 3px; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .sc-desc { font-size: 12px; color: var(--chalk-dim); line-height: 1.38; }
  .sc-bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .sc-fill { height: 100%; background: linear-gradient(90deg, var(--brass-dim), var(--brass-bright)); }

  /* Mastery Ledger Cells */
  .ledger-section-title {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--brass); margin: 4px 0 2px; display: flex; justify-content: space-between;
  }
  .ledger-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 5px;
  }
  .l-cell {
    padding: 5px 4px; border-radius: 4px; text-align: center;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px; border: 1px solid rgba(232,225,207,0.14);
    background: rgba(255,255,255,0.03); color: rgba(232,225,207,0.45);
  }
  .l-cell.amber {
    border-color: rgba(201,161,90,0.58);
    background: rgba(154, 107, 36, 0.25); color: #f0d399;
  }
  .l-cell.brass {
    border-color: rgba(232, 198, 130, 0.9);
    background: linear-gradient(145deg, rgba(196,148,64,0.45), rgba(112,78,24,0.38));
    color: #fff3d2; box-shadow: inset 0 1px 0 rgba(255,243,210,0.3);
  }
  .l-sub { font-size: 9px; opacity: 0.78; display: block; margin-top: 1px; }
  .summary-banner {
    padding: 10px 12px; border-radius: 5px;
    background: rgba(201,161,90,0.12); border: 1px solid rgba(201,161,90,0.4);
    font-size: 12px; line-height: 1.45; color: var(--chalk);
  }

  @media (max-width: 780px) {
    .hud-layer { padding: 8px 10px; }
    .brand-plate { min-width: auto; padding: 6px 9px; }
    .prompt-plate { min-width: 0; padding: 7px 11px; }
    .score-big { font-size: 26px; }
    .prompt-task { font-size: 12px; }
    .numpad-panel { right: 10px; bottom: 58px; width: 184px; }
    .hover-bed { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage-canvas"></canvas>

<div class="hud-layer">
  <div class="hud-top">
    <div class="plate brand-plate">
      <div class="brand-row">
        <div class="brand-title">Oche Light</div>
        <span id="ghost-pill" class="ghost-pill">Ghost Demo</span>
      </div>
      <button id="open-stages-btn" class="stage-btn" title="Choose stage or view Mastery Ledger">
        <span id="stage-label">Stage 2 · The Golden 44</span>
        <span class="caret">▼</span>
      </button>
    </div>

    <div class="plate prompt-plate">
      <div class="prompt-meta">
        <span id="prompt-sub">2-Dart Checkout</span>
        <span class="dart-icons" id="dart-icons">
          <span class="dart-pip"></span><span class="dart-pip"></span><span class="dart-pip"></span>
        </span>
        <span id="rival-tag" class="rival-tag" style="display:none">Rival on D16</span>
      </div>
      <div class="prompt-main">
        <div id="score-big" class="score-big">148</div>
        <div id="prompt-task" class="prompt-task">Click opening treble on the board</div>
      </div>
      <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    </div>

    <div class="right-stack">
      <div class="controls-row">
        <button id="hint-btn" class="hud-btn" title="Show formula or visual link on board (H)">Cue [H]</button>
        <button id="skip-btn" class="hud-btn" title="Next throw (N)">Next [N]</button>
        <button id="ledger-btn" class="hud-btn" title="Stages & Mastery Ledger (L)">Ledger [L]</button>
      </div>
      <div class="plate flow-plate">
        <span>FLOW <span id="flow-val" class="flow-val">0</span></span>
        <span>AVG <span id="avg-ms" class="flow-val">—</span></span>
        <span id="tier-badge" class="tier-badge t1">Guided</span>
      </div>
    </div>
  </div>

  <div class="hud-bottom">
    <button id="sound-pill" class="sound-pill">Click for Sound</button>
    <div id="feedback-strip" class="plate feedback-strip cue">
      Oche Ghost playing — click any bed on the 3D dartboard to take over.
    </div>
    <div class="plate hover-bed">
      <span>Aiming At</span>
      <div id="hover-bed-val">—</div>
    </div>
  </div>
</div>

<!-- Compact Slate Numpad (Numeric modes: Doubles/Trebles values, Miss Rule check, Croupier Marking) -->
<div id="numpad-panel" class="plate numpad-panel">
  <div id="numpad-display" class="numpad-display placeholder">Type score…</div>
  <div class="numpad-grid">
    <button class="np-key" data-k="7">7</button><button class="np-key" data-k="8">8</button><button class="np-key" data-k="9">9</button>
    <button class="np-key" data-k="4">4</button><button class="np-key" data-k="5">5</button><button class="np-key" data-k="6">6</button>
    <button class="np-key" data-k="1">1</button><button class="np-key" data-k="2">2</button><button class="np-key" data-k="3">3</button>
    <button class="np-key del" data-k="BACK">⌫</button><button class="np-key" data-k="0">0</button><button class="np-key enter" data-k="ENTER">CALL</button>
  </div>
</div>

<!-- Slide-Over Chalkboard Drawer -->
<div id="drawer-backdrop" class="drawer-backdrop">
  <div class="drawer">
    <div class="drawer-head">
      <div class="drawer-tabs">
        <button class="dtab active" data-tab="stages">Pub Ladder</button>
        <button class="dtab" data-tab="ledger">Mastery Ledger</button>
      </div>
      <button id="drawer-close" class="drawer-close" aria-label="Close">×</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ============================================================================
   1. VERIFIED DARTS GEOMETRY & CURRICULUM DATA (@yourdarts 2025-2026 Latest)
   ============================================================================ */
const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const SECTOR_INDEX = Object.fromEntries(SECTORS.map((s, i) => [s, i]));

const R_INNER_BULL = 0.09;
const R_OUTER_BULL = 0.21;
const R_TREBLE_IN  = 0.93;
const R_TREBLE_OUT = 1.09;
const R_DOUBLE_IN  = 1.56;
const R_DOUBLE_OUT = 1.72;
const R_NUM_RING   = 1.98;
const R_BOARD_EDGE = 2.26;

const ESSENTIAL_TREBLES = [10, 12, 13, 14, 15, 16, 17, 18, 19, 20];
const BOGEY_NUMBERS = new Set([159, 162, 163, 165, 166, 168, 169]);

function bedValue(code) {
  if (code === 'BULL') return 50;
  if (code === '25') return 25;
  const r = code[0], n = parseInt(code.slice(1), 10);
  if (r === 'T') return n * 3;
  if (r === 'D') return n * 2;
  return n;
}

function bedPretty(code) {
  if (code === 'BULL') return 'Bull (50)';
  if (code === '25') return '25';
  return `${code} (${bedValue(code)})`;
}

function bedToXY(code, opts = {}) {
  const jitter = opts.jitter ?? 0;
  const jx = (Math.random() - 0.5) * jitter;
  const jy = (Math.random() - 0.5) * jitter;
  if (code === 'BULL') return { x: jx * 0.4, y: jy * 0.4 };
  if (code === '25') {
    const a = opts.angle ?? Math.random() * Math.PI * 2;
    const r = (R_INNER_BULL + R_OUTER_BULL) * 0.52;
    return { x: Math.sin(a) * r + jx * 0.4, y: Math.cos(a) * r + jy * 0.4 };
  }
  const ring = code[0];
  const sec = parseInt(code.slice(1), 10);
  const idx = SECTOR_INDEX[sec];
  let theta = idx * (Math.PI / 10);
  if (opts.wireShift) theta += opts.wireShift;
  let r;
  if (ring === 'D') r = opts.bottomWire ? (R_DOUBLE_IN + 0.03) : (R_DOUBLE_IN + R_DOUBLE_OUT) * 0.5;
  else if (ring === 'T') r = (R_TREBLE_IN + R_TREBLE_OUT) * 0.5;
  else r = opts.aimHigh ? 1.38 : (opts.inner ? 0.58 : 1.32);
  return { x: Math.sin(theta) * r + jx, y: Math.cos(theta) * r + jy };
}

function xyToBed(x, y) {
  const r = Math.hypot(x, y);
  if (r > R_DOUBLE_OUT + 0.05) return null;
  if (r <= R_INNER_BULL) return { code: 'BULL', ring: 'BULL', sector: 25, value: 50, sub: 'BULL' };
  if (r <= R_OUTER_BULL) return { code: '25', ring: '25', sector: 25, value: 25, sub: '25' };
  let cw = Math.atan2(x, y);
  if (cw < 0) cw += Math.PI * 2;
  const idx = Math.floor(((cw + Math.PI / 20) % (Math.PI * 2)) / (Math.PI / 10));
  const sector = SECTORS[idx];
  if (r >= R_DOUBLE_IN && r <= R_DOUBLE_OUT + 0.05) {
    return { code: 'D' + sector, ring: 'D', sector, value: sector * 2, sub: 'D' };
  }
  if (r >= R_TREBLE_IN && r <= R_TREBLE_OUT) {
    return { code: 'T' + sector, ring: 'T', sector, value: sector * 3, sub: 'T' };
  }
  return { code: 'S' + sector, ring: 'S', sector, value: sector, sub: r > R_TREBLE_OUT ? 'OS' : 'IS' };
}

/* ============================================================================
   2. SPACED REPETITION, MASTERY LEDGER & LOCAL STORAGE ENGINE
   ============================================================================ */
const STORAGE_KEY = 'oche_light_mastery_v1';

class MasteryEngine {
  constructor() {
    this.data = this.load();
    this.turn = 0;
    this.recentRt = [];
  }
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { items: {}, streak: 0, bestStreak: 0, totalCorrect: 0, totalAttempts: 0 };
  }
  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (_) {}
  }
  reset() {
    this.data = { items: {}, streak: 0, bestStreak: 0, totalCorrect: 0, totalAttempts: 0 };
    this.recentRt = [];
    this.save();
  }
  get(id) {
    return this.data.items[id] || { ok: 0, miss: 0, streak: 0, bestMs: 99999, lastMs: 0, dueTurn: 0 };
  }
  // Tier 1 = Guided, Tier 2 = Hint-on-Hesitation, Tier 3 = Match-Speed Rolodex
  tier(id, speedTargetMs = 3000) {
    const s = this.get(id);
    if (s.streak >= 3 && s.bestMs <= speedTargetMs) return 3;
    if (s.ok >= 1 && s.streak >= 1) return 2;
    return 1;
  }
  // Visual ledger status: 'dim' | 'amber' | 'brass'
  badge(id, speedTargetMs = 2800) {
    const s = this.get(id);
    if (s.streak >= 2 && s.bestMs <= speedTargetMs) return 'brass';
    if (s.ok >= 1) return 'amber';
    return 'dim';
  }
  record(id, correct, ms, usedHint = false, speedTargetMs = 3000) {
    this.turn++;
    const s = this.get(id);
    this.data.totalAttempts++;
    if (correct) {
      this.data.totalCorrect++;
      this.data.streak++;
      if (this.data.streak > this.data.bestStreak) this.data.bestStreak = this.data.streak;
      s.ok++;
      s.lastMs = Math.round(ms);
      if (!usedHint && ms < s.bestMs) s.bestMs = Math.round(ms);
      if (usedHint || ms > speedTargetMs * 1.2) {
        s.streak = Math.max(1, s.streak);
        s.dueTurn = this.turn + 3; // resurface soon if slow or hinted
      } else {
        s.streak++;
        s.dueTurn = this.turn + Math.min(20, 4 + s.streak * 4);
      }
      this.recentRt.push(ms);
      if (this.recentRt.length > 12) this.recentRt.shift();
    } else {
      this.data.streak = 0;
      s.miss++;
      s.streak = 0;
      s.dueTurn = this.turn + 2; // Leitner: return in 2 turns!
    }
    this.data.items[id] = s;
    this.save();
  }
  pickNext(pool, idFn, avoidId = null) {
    if (!pool.length) return null;
    const candidates = pool.filter(p => idFn(p) !== avoidId);
    const list = candidates.length ? candidates : pool;
    // Prioritize overdue misses/slow items, then unseen, then weighted random
    let bestScore = -Infinity;
    let best = list[0];
    for (const item of list) {
      const id = idFn(item);
      const st = this.get(id);
      let priority = Math.random() * 2.5;
      if (st.miss > 0 && st.dueTurn <= this.turn) priority += 12;
      else if (st.dueTurn > 0 && st.dueTurn <= this.turn) priority += 7;
      else if (st.ok === 0 && st.miss === 0) priority += 5;
      else if (st.streak >= 3 && st.bestMs <= 2600) priority -= 3.5; // cool down mastered
      if (priority > bestScore) { bestScore = priority; best = item; }
    }
    return best;
  }
  avgMs() {
    if (!this.recentRt.length) return null;
    return Math.round(this.recentRt.reduce((a, b) => a + b, 0) / this.recentRt.length);
  }
}

const mastery = new MasteryEngine();

class PubAudio {
  constructor() {
    this.ctx = null;
    this.enabled = false;
    this.ambientGain = null;
  }
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.startAmbience();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.enabled = true;
    return true;
  }
  toggle() {
    if (!this.ctx) return this.unlock();
    this.enabled = !this.enabled;

// Post-processing RenderTarget at full DPR-aware crisp resolution + DepthTexture for subtle diorama tilt-shift
const RT_SCALE = 1.0;
function createPostTarget(w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rw = Math.max(640, Math.floor(w * dpr * RT_SCALE));
  const rh = Math.max(400, Math.floor(h * dpr * RT_SCALE));
  const depthTex = new THREE.DepthTexture(rw, rh);
  depthTex.type = THREE.UnsignedIntType;
  const rt = new THREE.WebGLRenderTarget(rw, rh, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    depthBuffer: true,
    depthTexture: depthTex,
  });
  return rt;
}

const postScene = new THREE.Scene();

const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: postRT.texture },
    tDepth: { value: postRT.depthTexture },
    uResolution: { value: new THREE.Vector2(postRT.width, postRT.height) },
    uNear: { value: camera.near },
    uFar: { value: camera.far },
    uFocusDepth: { value: 8.75 },
    uTime: { value: 0 },
    uFlowBoost: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform sampler2D tDepth;
    uniform vec2 uResolution;
    uniform float uNear;
    uniform float uFar;
    uniform float uFocusDepth;
    uniform float uTime;
    uniform float uFlowBoost;
    varying vec2 vUv;

    float linearizeDepth(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }

    float bayer4(vec2 p) {
      vec2 m = mod(floor(p), 4.0);
      int idx = int(m.x) + int(m.y) * 4;
      float v = 0.0;
      if (idx == 0) v = 0.0; else if (idx == 1) v = 8.0; else if (idx == 2) v = 2.0; else if (idx == 3) v = 10.0;
      else if (idx == 4) v = 12.0; else if (idx == 5) v = 4.0; else if (idx == 6) v = 14.0; else if (idx == 7) v = 6.0;
      else if (idx == 8) v = 3.0; else if (idx == 9) v = 11.0; else if (idx == 10) v = 1.0; else if (idx == 11) v = 9.0;
      else if (idx == 12) v = 15.0; else if (idx == 13) v = 7.0; else if (idx == 14) v = 13.0; else v = 5.0;
      return (v + 0.5) / 16.0 - 0.5;
    }

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 texel = 1.0 / uResolution;
      float rawD = texture2D(tDepth, vUv).r;
      float linD = linearizeDepth(rawD);
      // Crisp focal plane across the entire dartboard & slate chalkboard; subtle diorama blur only on far foreground/background & extreme top/bottom margins
      float depthDiff = abs(linD - uFocusDepth);
      float depthBlur = smoothstep(1.25, 4.4, depthDiff);
      float vertTilt = smoothstep(0.43, 0.52, abs(vUv.y - 0.50));
      float coc = clamp(depthBlur * 0.95 + vertTilt * 0.75, 0.0, 1.0) * 1.45;

      vec3 col;
      if (coc < 0.14) {
        // Gentle unsharp clarity pass on the sharp focal band (keeps sisal, wires, numerals & chalk razor-crisp!)
        vec3 c0 = texture2D(tDiffuse, vUv).rgb;
        vec3 avg = (
          texture2D(tDiffuse, vUv + vec2( texel.x, 0.0)).rgb +
          texture2D(tDiffuse, vUv + vec2(-texel.x, 0.0)).rgb +
          texture2D(tDiffuse, vUv + vec2(0.0,  texel.y)).rgb +
          texture2D(tDiffuse, vUv + vec2(0.0, -texel.y)).rgb

        col = clamp(c0 + (c0 - avg) * 0.28, 0.0, 1.0);

        col = texture2D(tDiffuse, vUv).rgb * 0.24;
        float r1 = coc * 0.65;
        float r2 = coc * 1.25;

        col += texture2D(tDiffuse, vUv + vec2(-r1,  0.0) * texel).rgb * 0.10;
        col += texture2D(tDiffuse, vUv + vec2( 0.0,  r1) * texel).rgb * 0.10;
        col += texture2D(tDiffuse, vUv + vec2( 0.0, -r1) * texel).rgb * 0.10;
        col += texture2D(tDiffuse, vUv + vec2( r2,  r2) * 0.707 * texel).rgb * 0.09;
        col += texture2D(tDiffuse, vUv + vec2(-r2,  r2) * 0.707 * texel).rgb * 0.09;
        col += texture2D(tDiffuse, vUv + vec2( r2, -r2) * 0.707 * texel).rgb * 0.09;

      float lum = dot(col, vec3(0.299, 0.587, 0.114));

      vec3 warmTint = vec3(1.03 + uFlowBoost * 0.03, 1.01 + uFlowBoost * 0.01, 0.97);
      col *= mix(shadowTint, warmTint, smoothstep(0.05, 0.52, lum));

      float ditherAmt = smoothstep(0.36, 0.03, lum) * 0.42;

function makeSisalBoardTextures() {
  const size = 2048;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const half = size / 2;
  const scale = half / R_BOARD_EDGE;

  // Outer black surround
  ctx.fillStyle = '#141618';
  ctx.fillRect(0, 0, size, size);

  // Subtle dark surround ring texture
  ctx.beginPath();
  ctx.arc(half, half, R_BOARD_EDGE * scale, 0, Math.PI * 2);
  ctx.fillStyle = '#181a1d';
  ctx.fill();

  const COL_DARK = '#1c1e22';
  const COL_CREAM = '#e5d9bc';
  const COL_RED = '#ad2a25';
  const COL_GREEN = '#216e3f';

  function drawWedge(rIn, rOut, i, color) {
    // Canvas angle: 0 at +X, clockwise down (+Y). Sector 0 (20) is at -PI/2 (top).
    const a0 = -Math.PI / 2 + (i - 0.5) * (Math.PI / 10);
    const a1 = -Math.PI / 2 + (i + 0.5) * (Math.PI / 10);
    ctx.beginPath();
    ctx.arc(half, half, rOut * scale, a0, a1, false);
    ctx.arc(half, half, rIn * scale, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  for (let i = 0; i < 20; i++) {
    const even = i % 2 === 0;
    const singleCol = even ? COL_DARK : COL_CREAM;
    const ringCol = even ? COL_RED : COL_GREEN;
    drawWedge(R_OUTER_BULL, R_TREBLE_IN, i, singleCol);
    drawWedge(R_TREBLE_IN, R_TREBLE_OUT, i, ringCol);
    drawWedge(R_TREBLE_OUT, R_DOUBLE_IN, i, singleCol);
    drawWedge(R_DOUBLE_IN, R_DOUBLE_OUT, i, ringCol);
  }

  // Outer Bull (25) & Inner Bull (50)
  ctx.beginPath(); ctx.arc(half, half, R_OUTER_BULL * scale, 0, Math.PI * 2);
  ctx.fillStyle = COL_GREEN; ctx.fill();
  ctx.beginPath(); ctx.arc(half, half, R_INNER_BULL * scale, 0, Math.PI * 2);
  ctx.fillStyle = COL_RED; ctx.fill();

  // Organic sisal bristle pores & subtle wear marks (especially around T20/T19!)
  const img = ctx.getImageData(0, 0, size, size);
  const data = img.data;
  for (let y = 0; y < size; y++) {
    const dy = (y - half) / scale;
    for (let x = 0; x < size; x++) {
      const dx = (x - half) / scale;
      const r = Math.hypot(dx, dy);
      if (r > R_BOARD_EDGE) continue;
      const idx = (y * size + x) * 4;
      const n = ((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1 + 1) % 1;
      const fiber = (n - 0.5) * (r <= R_DOUBLE_OUT ? 22 : 12);
      // Tiny sisal pinhole dimples
      const pit = n > 0.986 && r <= R_DOUBLE_OUT ? -26 : 0;
      data[idx]     = Math.max(0, Math.min(255, data[idx] + fiber + pit));
      data[idx + 1] = Math.max(0, Math.min(255, data[idx + 1] + fiber + pit));
      data[idx + 2] = Math.max(0, Math.min(255, data[idx + 2] + fiber * 0.9 + pit));
    }
  }
  ctx.putImageData(img, 0, 0);

  // Subtle painted pub brand stencil on bottom rim of surround
  ctx.save();
  ctx.fillStyle = 'rgba(209, 178, 118, 0.34)';
  ctx.font = 'bold 34px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('OCHE LIGHT · LONDON SISAL', half, half + 2.16 * scale);
  ctx.restore();

  // Crisp vintage numerals painted with clean high-contrast pewter-cream highlight on surround

  ctx.textBaseline = 'middle';
  for (let i = 0; i < 20; i++) {
    const theta = i * (Math.PI / 10);
    const nx = half + Math.sin(theta) * R_NUM_RING * scale;
    const ny = half - Math.cos(theta) * R_NUM_RING * scale;

    ctx.fillStyle = '#f3ebd7';
    ctx.fillText(String(SECTORS[i]), nx, ny);
  }
  ctx.restore();

  const colorTex = new THREE.CanvasTexture(c);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // Matching sisal bump map
  const bc = document.createElement('canvas');
  bc.width = bc.height = 512;
  const bctx = bc.getContext('2d');
  const bimg = bctx.createImageData(512, 512);
  for (let i = 0; i < bimg.data.length; i += 4) {
    const v = 115 + Math.floor(Math.random() * 55);
    bimg.data[i] = bimg.data[i+1] = bimg.data[i+2] = v;
    bimg.data[i+3] = 255;
  }
  bctx.putImageData(bimg, 0, 0);
  const bumpTex = new THREE.CanvasTexture(bc);
  bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
  bumpTex.repeat.set(3, 3);

  return { colorTex, bumpTex };
}

function wrapText(ctx, text, maxW) {
  const words = String(text || '').split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

  ctx.font = '700 112px Georgia, serif';
  ctx.fillText(String(big), 256, 204);

  if (sub) {
    ctx.fillStyle = '#e5c586';
    ctx.font = 'italic 27px Georgia, serif';
    const subLines = wrapText(ctx, sub, 430);
    subLines.slice(0, 2).forEach((ln, idx) => ctx.fillText(ln, 256, 250 + idx * 33));
  }

  ctx.strokeStyle = 'rgba(232, 225, 207, 0.22)';
  ctx.beginPath(); ctx.moveTo(46, 306); ctx.lineTo(466, 306); ctx.stroke();

  // Chalk notes / step trace
  ctx.textAlign = 'left';
  let y = 354;
  for (const entry of lines.slice(0, 7)) {
    const isWarn = typeof entry === 'object' && entry.kind === 'warn';
    const isGood = typeof entry === 'object' && entry.kind === 'ok';
    const txt = typeof entry === 'string' ? entry : entry.text;
    ctx.fillStyle = isWarn ? '#f4b8b0' : isGood ? '#c2f0d0' : '#f2ece0';
    ctx.font = '26px Georgia, serif';
    const wrapped = wrapText(ctx, txt, 424);
    for (const wln of wrapped) {
      if (y > 670) break;
      ctx.fillText(wln, 44, y);
      y += 35;
    }
    y += 10;
  }

  if (footer) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(183, 213, 238, 0.85)';
    ctx.font = '21px ui-monospace, monospace';
    ctx.fillText(footer, 256, 720);
  }
  ctx.restore();
  chalkTex.needsUpdate = true;
}

function makeBedShapeMesh(code, colorHex, opacity = 0.44, extra = {}) {
  let geo;
  if (code === 'BULL') {
    geo = new THREE.CircleGeometry(R_INNER_BULL, 32);
  } else if (code === '25') {
    geo = new THREE.RingGeometry(R_INNER_BULL, R_OUTER_BULL, 36);
  } else {
    const ring = code[0];
    const sec = parseInt(code.slice(1), 10);
    const idx = SECTOR_INDEX[sec];
    // Three.js RingGeometry theta starts at +X counterclockwise!
    // Sector center clockwise from +Y is idx*PI/10 -> CCW from +X is PI/2 - idx*PI/10
    const centerCCW = Math.PI / 2 - idx * (Math.PI / 10);
    const thetaStart = centerCCW - Math.PI / 20;
    let rIn, rOut;
    if (ring === 'D') { rIn = R_DOUBLE_IN; rOut = R_DOUBLE_OUT; }
    else if (ring === 'T') { rIn = R_TREBLE_IN; rOut = R_TREBLE_OUT; }
    else if (extra.aimHigh) { rIn = R_TREBLE_OUT + 0.02; rOut = R_DOUBLE_IN - 0.02; }
    else if (extra.innerOnly) { rIn = R_OUTER_BULL + 0.01; rOut = R_TREBLE_IN - 0.01; }
    else { rIn = R_OUTER_BULL; rOut = R_DOUBLE_IN; }
    geo = new THREE.RingGeometry(rIn, rOut, 18, 1, thetaStart, Math.PI / 10);
  }
  const mat = new THREE.MeshBasicMaterial({
    color: colorHex, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide,
  });
  return new THREE.Mesh(geo, mat);
}

function clearGroup(grp) {
  while (grp.children.length) {
    const ch = grp.children.pop();
    if (ch.geometry) ch.geometry.dispose();
    if (ch.material) ch.material.dispose();
  }
}

const activeDarts = [];

function buildDartMesh(accentHex = 0x8f231e) {
  const g = new THREE.Group();
  // Local +Z points back toward flight, tip is at z = 0 (so embedding at z=0 puts tip right into sisal!)
  const tipMat = new THREE.MeshStandardMaterial({ color: 0xbec5cc, roughness: 0.28, metalness: 0.88 });
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x7b8088, roughness: 0.36, metalness: 0.86 });
  const shaftMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.65, metalness: 0.15 });
  const flightMat = new THREE.MeshStandardMaterial({ color: accentHex, roughness: 0.72, metalness: 0.05, side: THREE.DoubleSide });

  // Steel point (-0.08 into sisal to +0.22) — zero cast shadows onto dartboard
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.002, 0.30, 8), tipMat);
  tip.rotation.x = Math.PI / 2; tip.position.z = 0.07; tip.castShadow = false;
  g.add(tip);

  // Knurled tungsten barrel (+0.22 to +0.70)
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, 0.48, 12), barrelMat);
  barrel.rotation.x = Math.PI / 2; barrel.position.z = 0.45; barrel.castShadow = false;
  g.add(barrel);

  // Brass grip rings on barrel
  [0.36, 0.46, 0.56].forEach(z => {
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.005, 6, 14), brassMat);
    r.position.z = z;
    g.add(r);
  });

  // Stem (+0.69 to +1.12)
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, 0.44, 8), shaftMat);
  stem.rotation.x = Math.PI / 2; stem.position.z = 0.90; stem.castShadow = false;
  g.add(stem);

  // 4-Vane Cross Flights (+1.02 to +1.44)
  const fShape = new THREE.Shape();
  fShape.moveTo(0, 0);
  fShape.lineTo(0.14, 0.08);
  fShape.lineTo(0.16, 0.36);
  fShape.lineTo(0.02, 0.42);
  fShape.lineTo(0, 0.42);
  fShape.closePath();
  const fGeo = new THREE.ShapeGeometry(fShape);
  for (let k = 0; k < 4; k++) {
    const vane = new THREE.Mesh(fGeo, flightMat);
    vane.rotation.x = Math.PI / 2;
    vane.rotation.z = k * (Math.PI / 2);
    vane.position.z = 1.02;
    vane.castShadow = false;
    g.add(vane);
  }
  return g;
}

function clearDarts() {
  for (const d of activeDarts) dartPoolGroup.remove(d.mesh);
  activeDarts.length = 0;
}

function throwDartTo(x, y, { kind = 'S', accent = 0x8f231e, delay = 0, onLand = null, wireTink = false } = {}) {
  const mesh = buildDartMesh(accent);
  const start = new THREE.Vector3(x * 0.35 + (Math.random() - 0.5) * 0.45, -1.55, 6.2);
  const end = new THREE.Vector3(x, y, 0.0);
  mesh.position.copy(start);
  mesh.visible = delay <= 0;
  dartPoolGroup.add(mesh);

  const entryPitch = -0.10 - Math.random() * 0.07; // slight realistic tail-up pub throw angle
  const entryYaw = (Math.random() - 0.5) * 0.07;

  const dart = {
    mesh, start, end, t: -delay, duration: 0.28,
    landed: false, wobbleT: 0, entryPitch, entryYaw,
    kind, wireTink, onLand,
  };
  activeDarts.push(dart);
  return dart;
}

function updateDarts(dt) {
  for (const d of activeDarts) {
    if (!d.landed) {
      d.t += dt;
      if (d.t < 0) continue;
      d.mesh.visible = true;
      const u = Math.min(1, d.t / d.duration);
      const pos = new THREE.Vector3().lerpVectors(d.start, d.end, u);
      pos.y += Math.sin(u * Math.PI) * 0.58; // realistic parabolic loft
      d.mesh.position.copy(pos);
      // Orient along trajectory tangent
      const uNext = Math.min(1, u + 0.04);
      const next = new THREE.Vector3().lerpVectors(d.start, d.end, uNext);
      next.y += Math.sin(uNext * Math.PI) * 0.58;
      // Local -Z points toward tip? No: tip at 0, flight at +Z, so looking AWAY from target aligns tip forward!
      d.mesh.lookAt(pos.clone().sub(next.clone().sub(pos)));

      if (u >= 1) {
        d.landed = true;
        d.mesh.position.copy(d.end);
        d.mesh.rotation.set(d.entryPitch, d.entryYaw, Math.random() * Math.PI);
        audio.playThud(d.kind);
        if (d.wireTink) audio.playWireTink();
        spawnBurst(d.end.x, d.end.y, d.wireTink ? 'spark' : 'chalk');
        cameraKick = 0.032;
        if (d.onLand) d.onLand();
      }
    } else if (d.wobbleT < 0.45) {
      d.wobbleT += dt;
      const damp = Math.exp(-d.wobbleT * 11) * Math.sin(d.wobbleT * 52) * 0.055;
      d.mesh.rotation.x = d.entryPitch + damp;
      d.mesh.rotation.y = d.entryYaw + damp * 0.6;
    }
  }
}

/* ---------- Challenge Generators for Every Stage ---------- */
function buildCalibrationQueue() {
  return [
    { kind: 'double_find', id: 'D18', target: 'D18', val: 36, speedMs: 2500, stageTag: 'STAGE_0A', cue: 'D18 = 2 × 18 = 36' },
    { kind: 'double_val',  id: 'D14', target: 'D14', val: 28, speedMs: 2500, stageTag: 'STAGE_0A', cue: 'D14 = 2 × 14 = 28' },
    { kind: 'treble_find', id: 'T14', target: 'T14', val: 42, speedMs: 2200, stageTag: 'STAGE_0B', cue: 'Essential Treble: T14 = 42' },
    { kind: 'treble_val',  id: 'T17', target: 'T17', val: 51, speedMs: 2200, stageTag: 'STAGE_0B', cue: 'Essential Treble: T17 = 51' },
    { kind: 'below60',     item: BELOW_60_ITEMS.find(x => x.id === 'B60_49_D16'), speedMs: 3200, stageTag: 'STAGE_1' },
    { kind: 'below60',     item: BELOW_60_ITEMS.find(x => x.id === 'B60_42_D18'), speedMs: 3200, stageTag: 'STAGE_1' },
    { kind: 'g44',         item: G44_BY_SCORE[75], speedMs: 3500, stageTag: 'STAGE_2' },
    { kind: 'g44',         item: G44_BY_SCORE[86], speedMs: 3500, stageTag: 'STAGE_2' },
    { kind: 'sods',        item: SODS_LAW_ITEMS.find(x => x.id === 'SL_62_1D'), speedMs: 3500, stageTag: 'STAGE_3' },
    { kind: 'tonplus',     item: TON_PLUS_ITEMS.find(x => x.id === 'TP_148'), speedMs: 4200, stageTag: 'STAGE_4' },
    { kind: 'tonplus',     item: TON_PLUS_ITEMS.find(x => x.id === 'TP_104_3D'), speedMs: 4200, stageTag: 'STAGE_4' },
    { kind: 'marking',     item: MARKING_ITEMS.find(x => x.id === 'MK_19_4X'), speedMs: 3500, stageTag: 'STAGE_6' },
  ];
}

function nextChallengeForStage(stageId) {
  if (stageId === 'CALIBRATION') {
    if (!state.calibQueue.length || state.calibIndex >= state.calibQueue.length) {
      state.calibQueue = buildCalibrationQueue();
      state.calibIndex = 0;
      state.calibStats = { ok: 0, total: 0, weakStages: new Set() };
    }
    return state.calibQueue[state.calibIndex];
  }

  if (stageId === 'STAGE_0A') {
    const roll = Math.random();
    if (roll < 0.28) {
      const h = mastery.pickNext(HALVING_CHAINS, x => x.id, state.lastItemId);
      return { kind: 'halving', id: h.id, start: h.start, target: h.next, speedMs: 2600, cue: h.cue };
    }
    const pool = [...SECTORS.map(s => ({ code: 'D' + s, val: s * 2 })), { code: 'BULL', val: 50 }];
    const picked = mastery.pickNext(pool, x => x.code, state.lastItemId);
    const askVal = roll > 0.64;
    return {
      kind: askVal ? 'double_val' : 'double_find',
      id: picked.code, target: picked.code, val: picked.val, speedMs: 2200,
      cue: picked.code === 'BULL' ? 'Inner Bull = 50' : `${picked.code} = 2 × ${picked.val / 2} = ${picked.val}`,
    };
  }

  if (stageId === 'STAGE_0B') {
    const pool = ESSENTIAL_TREBLES.map(n => ({ code: 'T' + n, val: n * 3 }));
    const picked = mastery.pickNext(pool, x => x.code, state.lastItemId);
    const askVal = Math.random() < 0.48;
    return {
      kind: askVal ? 'treble_val' : 'treble_find',
      id: picked.code, target: picked.code, val: picked.val, speedMs: 2000,
      cue: `${picked.code} = 3 × ${picked.val / 3} = ${picked.val}`,
    };
  }

  if (stageId === 'STAGE_1') {
    const coreMastered = BELOW_60_ITEMS.filter(x => x.tier === 'core' && mastery.get(x.id).ok >= 1).length;
    const pool = coreMastered >= 8 ? BELOW_60_ITEMS : BELOW_60_ITEMS.filter(x => x.tier === 'core');
    const item = mastery.pickNext(pool, x => x.id, state.lastItemId);
    return { kind: 'below60', item, speedMs: 3200 };
  }

  if (stageId === 'STAGE_2') {
    // Motivating order: Green quick wins -> Yellow FDIs -> Drip-feed Red Outlaws 1-2 at a time!
    const greens = GOLDEN_44.filter(x => x.group === 'green');
    const yellows = GOLDEN_44.filter(x => x.group.startsWith('yellow'));
    const reds = GOLDEN_44.filter(x => x.group === 'red');
    const greenOk = greens.filter(x => mastery.get('G44_' + x.score).ok >= 1).length;
    const yellowOk = yellows.filter(x => mastery.get('G44_' + x.score).ok >= 1).length;
    let pool = greens;
    if (greenOk >= 5 || state.ghostMode) pool = [...greens, ...yellows];
    if (yellowOk >= 4 || state.ghostMode) {
      const unlockedReds = reds.slice(0, state.ghostMode ? 5 : Math.min(5, 1 + Math.floor(yellowOk / 3)));
      pool = [...greens, ...yellows, ...unlockedReds];
    }
    const item = mastery.pickNext(pool, x => 'G44_' + x.score, state.lastItemId);
    return { kind: 'g44', item, speedMs: 3200 };
  }

  if (stageId === 'STAGE_3') {
    const item = mastery.pickNext(SODS_LAW_ITEMS, x => x.id, state.lastItemId);
    return { kind: 'sods', item, speedMs: 3600 };
  }

  if (stageId === 'STAGE_4') {
    const item = mastery.pickNext(TON_PLUS_ITEMS, x => x.id, state.lastItemId);
    return { kind: 'tonplus', item, speedMs: 4400 };
  }

  if (stageId === 'STAGE_5') {
    const item = mastery.pickNext(BOGEY_ITEMS, x => x.id, state.lastItemId);
    return { kind: 'bogey', item, speedMs: 3600 };
  }

  if (stageId === 'STAGE_6') {
    const item = mastery.pickNext(MARKING_ITEMS, x => x.id, state.lastItemId);
    return { kind: 'marking', item, speedMs: 3800 };
  }
  return nextChallengeForStage('STAGE_2');
}

function challengeItemId(ch) {
  if (!ch) return 'NONE';
  if (ch.kind === 'g44') return 'G44_' + ch.item.score;
  if (ch.item) return ch.item.id;
  return ch.id;
}

function loadChallenge(ch) {
  clearDarts();
  clearGroup(overlayGroup);
  state.challenge = ch;
  state.lastItemId = challengeItemId(ch);
  state.stepIndex = 0;
  state.usedHint = false;
  state.hintShown = false;
  state.busy = false;
  state.challengeStartMs = performance.now();
  state.ghostTimer = 0;

  const id = state.lastItemId;
  const tier = state.hintMode === 'always' ? 1 : state.hintMode === 'blind' ? 3 : mastery.tier(id, ch.speedMs || 3000);
  updateTierBadge(tier);
  elRivalTag.style.display = 'none';

  // Configure per challenge type
  if (ch.kind === 'double_find') {
    state.dartsLeft = 1;
    elPromptSub.textContent = 'Stage 0A · Find Double';
    elScoreBig.textContent = String(ch.val);
    elPromptTask.textContent = `Click the double worth ${ch.val}`;
    showNumpad(false);
    renderChalkboard({ header: 'DOUBLES DRILL', big: ch.val, sub: 'Find the double bed', lines: tier === 1 ? [ch.cue] : ['Locate on the 3D board (<2s)'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'double_val') {
    state.dartsLeft = 1;
    elPromptSub.textContent = 'Stage 0A · Double Value';
    elScoreBig.textContent = ch.target;
    elPromptTask.textContent = `Enter the value of ${ch.target}`;
    showNumpad(true);
    showBoardOverlays({ highlights: [{ code: ch.target, color: 0xf3cc7d, opacity: 0.56 }] });
    renderChalkboard({ header: 'DOUBLES VALUE', big: ch.target, sub: 'Type total & press CALL', lines: tier === 1 ? [ch.cue] : ['2 × sector number (<2s)'] });
  } else if (ch.kind === 'halving') {
    state.dartsLeft = 2;
    elPromptSub.textContent = 'Stage 0A · Halving Chain';
    elScoreBig.textContent = ch.start;
    elPromptTask.textContent = `Missed ${ch.start} inside -> click next double!`;
    showNumpad(false);
    const p = bedToXY('S' + ch.start.slice(1), { inner: false });
    throwDartTo(p.x, p.y, { kind: 'S' });
    renderChalkboard({ header: 'HALVING CHAIN', big: ch.start, sub: `Inside single hit!`, lines: [tier === 1 ? ch.cue : 'Halve the double cleanly'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'treble_find') {
    state.dartsLeft = 1;
    elPromptSub.textContent = 'Stage 0B · Essential 10 Trebles';
    elScoreBig.textContent = String(ch.val);
    elPromptTask.textContent = `Click the treble worth ${ch.val}`;
    showNumpad(false);
    renderChalkboard({ header: '10 TREBLES', big: ch.val, sub: 'Bidirectional <2s', lines: [tier === 1 ? ch.cue : 'T10 & T12–T20 only'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'treble_val') {
    state.dartsLeft = 1;
    elPromptSub.textContent = 'Stage 0B · Essential 10 Trebles';
    elScoreBig.textContent = ch.target;
    elPromptTask.textContent = `Enter the value of ${ch.target}`;
    showNumpad(true);
    showBoardOverlays({ highlights: [{ code: ch.target, color: 0xf3cc7d, opacity: 0.62 }] });
    renderChalkboard({ header: '10 TREBLES', big: ch.target, sub: 'Type value (<2s)', lines: [tier === 1 ? ch.cue : 'Instant recall, no counting'] });
  } else if (ch.kind === 'below60') {
    const it = ch.item;
    state.remainingScore = it.score;
    state.dartsLeft = it.darts || 2;
    elPromptSub.textContent = it.targetD === 'ANY' ? 'Stage 1 · Setup Playbook' : `Stage 1 · Leave ${it.targetD}`;
    elScoreBig.textContent = String(it.score);
    elPromptTask.textContent = it.targetD === 'ANY'
      ? `Click smart setup on ${it.score}`
      : `Click single setup to leave ${it.targetD}`;
    showNumpad(false);
    renderChalkboard({ header: 'BELOW 60', big: it.score, sub: it.targetD === 'ANY' ? 'Safe setup / wedge' : `Target: ${it.targetD}`,
      lines: [tier === 1 ? it.cue : 'Apply -2 (D16), +4 (D18/D8), +2 (D14/D4), +6 (D12)'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'g44') {
    const it = ch.item;
    state.remainingScore = it.score;
    state.dartsLeft = 2;
    const grpName = it.group === 'green' ? 'Green Quick Win' : it.group === 'red' ? 'Red Outlaw' : 'Yellow FDI';
    elPromptSub.textContent = `Stage 2 · Golden 44 (${grpName})`;
    elScoreBig.textContent = String(it.score);
    elPromptTask.textContent = `2-dart checkout on ${it.score} — click Dart 1`;
    showNumpad(false);
    renderChalkboard({ header: 'GOLDEN 44', big: it.score, sub: grpName,
      lines: [tier === 1 ? it.cue : 'Dart 1 -> Double -> Miss Rule'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'sods') {
    const it = ch.item;
    state.remainingScore = it.score;
    state.dartsLeft = it.darts;
    const rival = it.rivalClose || state.rivalPressure;
    if (rival) {
      elRivalTag.style.display = 'inline-block';
      elRivalTag.textContent = 'Rival on D16!';
      elRivalTag.className = 'rival-tag';
    }
    elPromptSub.textContent = `Stage 3 · Sod's Law (${it.darts} ${it.darts === 1 ? 'Dart' : 'Darts'} Left)`;
    elScoreBig.textContent = String(it.score);
    elPromptTask.textContent = it.darts === 1
      ? `1 dart left on ${it.score} — click best setup!`
      : `Play ${it.score} safely (watch for single-miss!)`;
    showNumpad(false);
    renderChalkboard({ header: "SOD'S LAW", big: it.score, sub: `${it.darts} dart(s) in hand`,
      lines: [tier === 1 ? it.cue : 'Track darts in hand & <70 safety'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'tonplus') {
    const it = ch.item;
    state.remainingScore = it.score;
    state.dartsLeft = 3;
    elPromptSub.textContent = 'Stage 4 · Ton-Plus (3 Darts)';
    elScoreBig.textContent = String(it.score);
    elPromptTask.textContent = `3 darts on ${it.score} — click opening treble`;
    showNumpad(false);
    renderChalkboard({ header: 'TON-PLUS 101-170', big: it.score, sub: '3 darts in hand',
      lines: [tier === 1 ? it.cue : 'Rule of 40 (+40), Rule of 43 (+43), check splash traps'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'bogey') {
    const it = ch.item;
    state.remainingScore = it.rem;
    state.dartsLeft = 1;
    elPromptSub.textContent = `Stage 5 · Bogey Dodger (Started ${it.score})`;
    elScoreBig.textContent = String(it.rem);
    elPromptTask.textContent = `Dart 3 after ${it.prior.join('+')} — avoid bogey!`;
    showNumpad(false);
    // Embed prior 2 darts visually on T20/S20
    it.prior.forEach((b, i) => {
      const p = bedToXY(b, { jitter: 0.08 });
      throwDartTo(p.x, p.y, { kind: b[0], delay: i * 0.08 });
    });
    renderChalkboard({ header: 'BOGEY DODGER', big: it.rem, sub: `Started ${it.score} · 1 dart left`,
      lines: [tier === 1 ? it.cue : 'Teen Cover S(10+d) -> 170/160 (avoid 159,162,163,165,166,168,169)'] });
    if (tier === 1) applyChallengeHint(true);
  } else if (ch.kind === 'marking') {
    const it = ch.item;
    state.dartsLeft = 0;
    elPromptSub.textContent = 'Stage 6 · Croupier\'s Chalk';
    elScoreBig.textContent = '???';
    elPromptTask.textContent = 'Call the total before the brass bell!';
    showNumpad(true);
    // Throw all 2-3 darts into the 3D board!
    ch.dartCoords = [];
    it.darts.forEach((code, idx) => {
      const p = bedToXY(code, { jitter: 0.05, inner: idx === 2 && code[0] === 'S' });
      ch.dartCoords.push({ code, x: p.x, y: p.y });
      throwDartTo(p.x, p.y, { kind: code[0], delay: idx * 0.13, accent: idx === it.oddIdx ? 0x2b4a69 : 0x8f231e });
    });
    renderChalkboard({ header: "CROUPIER'S CHALK", big: '???', sub: 'Visual shape call',
      lines: [tier === 1 ? it.cue : 'Snap 2 known darts first ("What do I know?")'] });
    if (tier === 1) applyChallengeHint(true);
  }

  audio.playChalk();
  updateHudStats();
}

function applyChallengeHint(auto = false) {
  const ch = state.challenge;
  if (!ch) return;
  if (!auto) state.usedHint = true;
  state.hintShown = true;

  if (ch.kind === 'double_find' || ch.kind === 'treble_find' || ch.kind === 'halving') {
    showBoardOverlays({ highlights: [{ code: ch.target, color: 0xf3cc7d, opacity: 0.55 }] });
    setFeedback(`Cue: ${ch.cue}`, 'cue');
  } else if (ch.kind === 'double_val' || ch.kind === 'treble_val') {
    setFeedback(`Cue: ${ch.cue}`, 'cue');
  } else if (ch.kind === 'below60') {
    const it = ch.item;
    const hl = state.stepIndex === 0
      ? it.setup.map(c => ({ code: c, color: 0xf3cc7d, opacity: 0.45 }))
      : [{ code: 'D' + (state.remainingScore / 2), color: 0x79d499, opacity: 0.52 }];
    showBoardOverlays({ highlights: hl, aimHigh: it.aimHigh && state.stepIndex === 0 ? it.setup[0] : null });
    setFeedback(`Cue: ${it.cue}`, 'cue');
  } else if (ch.kind === 'g44') {
    const it = ch.item;
    if (ch.missPrompt) {
      setFeedback(`Miss Rule: ${it.score} - ${bedValue('S' + it.route[0].slice(1))} = ${it.miss}`, 'cue');
    } else {
      const target = it.route[state.stepIndex] || it.route[0];
      showBoardOverlays({
        highlights: [{ code: target, color: 0xf3cc7d, opacity: 0.5 }],
        link: it.link || null,
        aimHigh: it.aimHigh && state.stepIndex === 0 ? 'S20' : null,
      });
      setFeedback(`Cue: ${it.cue}`, 'cue');
    }
  } else if (ch.kind === 'sods') {
    const it = ch.item;
    const trapBeds = it.trap ? Object.keys(it.trap) : [];
    const hl = state.stepIndex === 0
      ? it.valid.map(c => ({ code: c, color: 0xf3cc7d, opacity: 0.48 }))
      : [];
    showBoardOverlays({ highlights: hl, trapBeds });
    setFeedback(`Cue: ${it.cue}`, 'cue');
  } else if (ch.kind === 'tonplus') {
    const it = ch.item;
    const trapBeds = it.traps ? Object.keys(it.traps) : [];
    const hl = state.stepIndex === 0
      ? it.open.map(c => ({ code: c, color: 0xf3cc7d, opacity: 0.48 }))
      : [];
    showBoardOverlays({ highlights: hl, trapBeds });
    setFeedback(`Cue: ${it.cue}`, 'cue');
  } else if (ch.kind === 'bogey') {
    const it = ch.item;
    showBoardOverlays({
      highlights: [{ code: it.cover, color: 0xf3cc7d, opacity: 0.45 }],
      trapBeds: it.centerOk ? ['S20'] : ['S20', '25', 'BULL'],
    });
    setFeedback(`Cue: ${it.cue}`, 'cue');
  } else if (ch.kind === 'marking') {
    const it = ch.item;
    const rings = [];
    if (ch.dartCoords) {
      ch.dartCoords.forEach((dc, idx) => {
        const isOdd = idx === it.oddIdx;
        rings.push({ x: dc.x, y: dc.y, color: isOdd ? 0x7ba3c4 : 0xf3cc7d });
      });
    }
    showBoardOverlays({ groupRings: rings });
    setFeedback(`Cue: ${it.cue}`, 'cue');
  }
}

function advanceAfter(delayMs = 1150) {
  state.busy = true;
  setTimeout(() => {
    if (state.stage === 'CALIBRATION') {
      state.calibIndex++;
      if (state.calibIndex >= state.calibQueue.length) {
        finishCalibration();
        return;
      }
    }
    loadChallenge(nextChallengeForStage(state.stage));
  }, delayMs);
}

function finishCalibration() {
  const { ok, total, weakStages } = state.calibStats;
  const order = ['STAGE_0A', 'STAGE_0B', 'STAGE_1', 'STAGE_2', 'STAGE_3', 'STAGE_4', 'STAGE_6'];
  const rec = order.find(s => weakStages.has(s)) || 'STAGE_2';
  const recTitle = STAGES.find(s => s.id === rec)?.short || rec;
  setFeedback(`Calibration Complete (${ok}/${total})! Recommended start: ${recTitle}`, 'ok');
  audio.playApplause();
  renderChalkboard({
    header: 'CALIBRATION DONE', big: `${ok}/${total}`, sub: 'Recommended Stage:',
    lines: [{ text: recTitle, kind: 'ok' }, 'Slow beds queued for spaced review!'],
  });
  state.stage = rec;
  setTimeout(() => loadChallenge(nextChallengeForStage(state.stage)), 2400);
}

function completeChallenge(correct, customMsg = null, customCueLines = null) {
  const ch = state.challenge;
  if (!ch) return;
  const id = challengeItemId(ch);
  const ms = performance.now() - state.challengeStartMs;
  if (!state.ghostMode) {
    mastery.record(id, correct, ms, state.usedHint, ch.speedMs || 3000);
    if (state.stage === 'CALIBRATION') {
      state.calibStats.total++;
      if (correct && ms <= (ch.speedMs || 3200) * 1.35) state.calibStats.ok++;
      else if (ch.stageTag) state.calibStats.weakStages.add(ch.stageTag);
    }
  }
  updateHudStats();
  if (correct) {
    audio.playBell('ok');
    if (mastery.data.streak > 0 && mastery.data.streak % 5 === 0 && !state.ghostMode) audio.playApplause();
    setFeedback(customMsg || `Clean! (${(ms / 1000).toFixed(2)}s)`, 'ok');
    if (customCueLines) {
      renderChalkboard({ header: 'CHECKED OUT', big: '✓', sub: `${(ms / 1000).toFixed(2)}s`, lines: customCueLines });
    }
    advanceAfter(state.ghostMode ? 1250 : 1050);
  } else {
    audio.playWireTink();
    setFeedback(customMsg || 'Try again — check the chalk cue!', 'warn');
  }
}

/* ---------- Player & Ghost Interaction Handlers ---------- */
function handleBoardClick(bed, rawXY) {
  if (!bed || state.busy || !state.challenge) return;
  if (!audio.ctx) {
    audio.unlock();
    elSoundPill.textContent = 'Sound: On';
    elSoundPill.classList.add('on');
  }
  const ch = state.challenge;
  if (ch.kind === 'double_val' || ch.kind === 'treble_val' || ch.kind === 'marking' || ch.missPrompt) {
    return; // numeric response expected
  }

  const x = rawXY ? rawXY.x : bedToXY(bed.code).x;
  const y = rawXY ? rawXY.y : bedToXY(bed.code).y;

  // 1. Doubles / Trebles / Halving single-click modes
  if (ch.kind === 'double_find' || ch.kind === 'treble_find' || ch.kind === 'halving') {
    if (bed.code === ch.target) {
      throwDartTo(x, y, { kind: bed.ring });
      state.dartsLeft = Math.max(0, state.dartsLeft - 1);
      completeChallenge(true, `Spot on! ${ch.cue}`, [{ text: ch.cue, kind: 'ok' }]);
    } else {
      throwDartTo(x, y, { kind: bed.ring, wireTink: true });
      applyChallengeHint(false);
      completeChallenge(false, `That's ${bedPretty(bed.code)} — look for ${ch.cue}`);
    }
    return;
  }

  // 2. Stage 1 — Below-60 Double Smiths
  if (ch.kind === 'below60') {
    const it = ch.item;
    if (state.stepIndex === 0) {
      if (it.setup.includes(bed.code)) {
        const aimWarn = it.aimHigh && bed.sub === 'IS';
        throwDartTo(x, y, { kind: bed.ring });
        state.remainingScore -= bed.value;
        state.dartsLeft = Math.max(1, state.dartsLeft - 1);
        state.stepIndex = 1;
        elScoreBig.textContent = String(state.remainingScore);
        const nextD = 'D' + (state.remainingScore / 2);
        elPromptTask.textContent = `Leaves ${state.remainingScore} — finish on ${nextD}!`;
        updateHudStats();
        const extra = it.wedge ? 'Safe wire wedge! ' : aimWarn ? 'Good bed (tip: aim HIGH above treble!). ' : '';
        setFeedback(`${extra}${bed.code} leaves ${state.remainingScore} (${nextD})`, 'ok');
        renderChalkboard({ header: 'BELOW 60', big: state.remainingScore, sub: `Finish on ${nextD}`, lines: [it.cue] });
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        applyChallengeHint(false);
        completeChallenge(false, `${bed.code} leaves ${it.score - bed.value}. ${it.cue}`);
      }
    } else {
      const targetD = 'D' + (state.remainingScore / 2);
      if (bed.code === targetD) {
        throwDartTo(x, y, { kind: 'D' });
        state.dartsLeft = 0;
        completeChallenge(true, `Game shot! ${it.cue}`, [{ text: it.cue, kind: 'ok' }]);
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        completeChallenge(false, `Need ${targetD} (${state.remainingScore}) to finish!`);
      }
    }
    return;
  }

  // 3. Stage 2 — The Golden 44 (2-dart finish + periodic 4-Rounds Miss Rule check!)
  if (ch.kind === 'g44') {
    const it = ch.item;
    const validFirsts = [it.route[0], ...it.alts.map(a => a[0])];
    if (state.stepIndex === 0) {
      if (validFirsts.includes(bed.code)) {
        throwDartTo(x, y, { kind: bed.ring });
        state.remainingScore -= bed.value;
        state.dartsLeft = 1;
        state.stepIndex = 1;
        ch.chosenFirst = bed.code;
        elScoreBig.textContent = String(state.remainingScore);
        const remBed = state.remainingScore === 50 ? 'BULL' : 'D' + (state.remainingScore / 2);
        elPromptTask.textContent = `${bed.code} hits! Finish on ${remBed}`;
        updateHudStats();
        renderChalkboard({ header: 'GOLDEN 44', big: state.remainingScore, sub: `${bed.code} -> ${remBed}`, lines: [it.cue] });
        setFeedback(`${bed.code} leaves ${state.remainingScore} -> click ${remBed}`, 'cue');
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        applyChallengeHint(false);
        completeChallenge(false, `${bed.code} isn't the route on ${it.score}. ${it.cue}`);
      }
    } else if (state.stepIndex === 1) {
      const targetOut = state.remainingScore === 50 ? 'BULL' : 'D' + (state.remainingScore / 2);
      if (bed.code === targetOut) {
        throwDartTo(x, y, { kind: targetOut === 'BULL' ? 'BULL' : 'D' });
        state.dartsLeft = 0;
        // 40% of player Golden 44 rounds ask quick Round-4 Miss Rule check!
        const firstIsTreble = ch.chosenFirst === it.route[0] && it.route[0][0] === 'T';
        if (!state.ghostMode && firstIsTreble && state.stage === 'STAGE_2' && Math.random() < 0.38) {
          ch.missPrompt = true;
          ch.missAns = it.miss;
          const singleName = 'S' + it.route[0].slice(1);
          elPromptSub.textContent = 'Round 4 · Miss Rule Check';
          elScoreBig.textContent = `${it.score} - ${singleName}`;
          elPromptTask.textContent = `Quick! If ${it.route[0]} hits ${singleName}, what's left?`;
          showNumpad(true);
          renderChalkboard({ header: 'MISS RULE', big: '?', sub: `${it.score} hit ${singleName}`, lines: ['Pair every finish with its single-miss leave!'] });
          setFeedback(`Checked out! Now Round 4: hit ${singleName} on ${it.score} -> what's left?`, 'cue');
        } else {
          completeChallenge(true, `Game shot ${it.score}! (${it.route.join(' ')} · Miss -> ${it.miss})`,
            [{ text: `${it.score}: ${it.route.join(' + ')}`, kind: 'ok' }, `Miss Rule -> ${it.miss}`, it.cue]);
        }
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        completeChallenge(false, `Need ${targetOut} (${state.remainingScore}) to check out!`);
      }
    }
    return;
  }

  // 4. Stage 3 — Sod's Law (Live Misses, 1-Dart Abandonment & Safety!)
  if (ch.kind === 'sods') {
    const it = ch.item;
    if (state.stepIndex === 0) {
      if (it.trap && it.trap[bed.code]) {
        const tr = it.trap[bed.code];
        const dp = bedToXY(tr.drift);
        throwDartTo(dp.x, dp.y, { kind: tr.drift[0], wireTink: true });
        applyChallengeHint(false);
        renderChalkboard({ header: 'TRAP TRIGGERED', big: it.score - bedValue(tr.drift), sub: `Drifted into ${tr.drift}!`, lines: [{ text: tr.why, kind: 'warn' }] });
        completeChallenge(false, tr.why);
        return;
      }
      if (it.valid.includes(bed.code)) {
        // Trigger realistic Sod's Law single-miss when flagged!
        if (it.forceMiss && it.darts >= 2 && (bed.code[0] === 'T' || bed.code[0] === 'D')) {
          const single = 'S' + bed.code.slice(1);
          const sp = bedToXY(single);
          throwDartTo(sp.x, sp.y, { kind: 'S' });
          state.remainingScore -= bedValue(single);
          state.dartsLeft = 1;
          state.stepIndex = 1;
          elScoreBig.textContent = String(state.remainingScore);
          elPromptTask.textContent = `Sod's Law! Hit ${single} -> ${state.remainingScore} left (1 dart). Click setup!`;
          updateHudStats();
          renderChalkboard({
            header: "SOD'S LAW MISS", big: state.remainingScore, sub: `${bed.code} dropped to ${single}`,
            lines: [`1 dart left on ${state.remainingScore}!`, 'Use -20 + add-back & set up a clean double!'],
          });
          setFeedback(`Sod's Law! ${bed.code} dropped into ${single} -> ${state.remainingScore} left (1 dart)!`, 'cue');
          return;
        }
        throwDartTo(x, y, { kind: bed.ring });
        state.dartsLeft = Math.max(0, state.dartsLeft - 1);
        completeChallenge(true, `Smart oche play! ${it.cue}`, [{ text: it.cue, kind: 'ok' }]);
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        applyChallengeHint(false);
        completeChallenge(false, `${bed.code} isn't optimal here. ${it.cue}`);
      }
    } else {
      // Follow-up after Sod's Law single miss (1 dart left to set up a clean double!)
      const rem = state.remainingScore;
      const leaves = rem - bed.value;
      const goodDoubles = new Set([40, 36, 32, 28, 24, 20, 16, 12, 8]);
      if (leaves === 0 && (bed.ring === 'D' || bed.ring === 'BULL')) {
        throwDartTo(x, y, { kind: bed.ring });
        completeChallenge(true, `Checkout saved!`, [{ text: `Checked out ${rem}!`, kind: 'ok' }]);
      } else if (goodDoubles.has(leaves) && (bed.ring === 'S' || bed.ring === 'T')) {
        throwDartTo(x, y, { kind: bed.ring });
        completeChallenge(true, `Clean save! ${bed.code} leaves D${leaves / 2} (${leaves}) when you return!`,
          [{ text: `${bed.code} -> D${leaves / 2} (${leaves})`, kind: 'ok' }, '"When I return!"']);
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        completeChallenge(false, `${bed.code} leaves ${leaves}. Aim to leave a clean double (D20/D18/D16/D10/D8)!`);
      }
    }
    return;
  }

  // 5. Stage 4 — Ton-Plus (101-170) & Diagnostic Splash Traps!
  if (ch.kind === 'tonplus') {
    const it = ch.item;
    if (state.stepIndex === 0) {
      if (it.traps && it.traps[bed.code]) {
        const tr = it.traps[bed.code];
        const dp = bedToXY(tr.drift);
        throwDartTo(dp.x, dp.y, { kind: tr.drift[0], wireTink: true });
        applyChallengeHint(false);
        renderChalkboard({
          header: 'SPLASH TRAP!', big: it.score - bedValue(tr.drift),
          sub: `${bed.code} drifted -> ${tr.drift}`,
          lines: [{ text: tr.why, kind: 'warn' }],
        });
        completeChallenge(false, tr.why);
        return;
      }
      if (it.open.includes(bed.code)) {
        throwDartTo(x, y, { kind: bed.ring });
        state.remainingScore -= bed.value;
        state.dartsLeft = 2;
        state.stepIndex = 1;
        ch.openedWith = bed.code;
        elScoreBig.textContent = String(state.remainingScore);
        const formulaNote = bed.code === 'T20' ? `Rule of 40 (+40) -> ${state.remainingScore}`
          : bed.code === 'T19' ? `Rule of 43 (+43) -> ${state.remainingScore}`
          : `${bed.code} leaves ${state.remainingScore}`;
        elPromptTask.textContent = `${formulaNote} — click Dart 2!`;
        updateHudStats();
        renderChalkboard({ header: 'TON-PLUS', big: state.remainingScore, sub: formulaNote, lines: [it.cue] });
        setFeedback(`${bed.code} hits! ${formulaNote}`, 'cue');
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        applyChallengeHint(false);
        completeChallenge(false, `Check your opening treble on ${it.score}. ${it.cue}`);
      }
    } else if (state.stepIndex === 1) {
      const rem = state.remainingScore;
      const leaves = rem - bed.value;
      const validSecond = (leaves === 50) || (leaves >= 2 && leaves <= 40 && leaves % 2 === 0);
      if (validSecond) {
        throwDartTo(x, y, { kind: bed.ring });
        state.remainingScore = leaves;
        state.dartsLeft = 1;
        state.stepIndex = 2;
        const outBed = leaves === 50 ? 'BULL' : 'D' + (leaves / 2);
        elScoreBig.textContent = String(leaves);
        elPromptTask.textContent = `Dart 3 for ${it.score} — finish on ${outBed}!`;
        updateHudStats();
        renderChalkboard({ header: 'TON-PLUS', big: leaves, sub: `Finish on ${outBed}`, lines: [it.cue] });
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        completeChallenge(false, `${bed.code} leaves ${leaves} (not a 1-dart out!). Try a Golden 44 finish on ${rem}!`);
      }
    } else {
      const outBed = state.remainingScore === 50 ? 'BULL' : 'D' + (state.remainingScore / 2);
      if (bed.code === outBed) {
        throwDartTo(x, y, { kind: outBed === 'BULL' ? 'BULL' : 'D' });
        state.dartsLeft = 0;
        audio.playApplause();
        completeChallenge(true, `TON-PLUS ${it.score} CHECKOUT! ${it.cue}`, [{ text: `${it.score} OUT!`, kind: 'ok' }, it.cue]);
      } else {
        throwDartTo(x, y, { kind: bed.ring, wireTink: true });
        completeChallenge(false, `Need ${outBed} (${state.remainingScore}) to take out ${it.score}!`);
      }
    }
    return;
  }

  // 6. Stage 5 — Bogey Dodger (220s/260s/300s Teen Cover + 228/268/308 center trap)
  if (ch.kind === 'bogey') {
    const it = ch.item;
    if (bed.code === it.cover) {
      throwDartTo(x, y, { kind: 'S' });
      state.dartsLeft = 0;
      completeChallenge(true, `Textbook Teen Cover! ${bed.code} leaves exact ${it.targetLeave}!`,
        [{ text: `${it.rem} - ${bed.value} = ${it.targetLeave}!`, kind: 'ok' }, it.cue]);
    } else if (bed.code === '25' || bed.code === 'BULL') {
      if (!it.centerOk) {
        const p25 = bedToXY('25');
        throwDartTo(p25.x, p25.y, { kind: '25', wireTink: true });
        applyChallengeHint(false);
        renderChalkboard({ header: 'BOGEY TRAP!', big: '163', sub: '25 left BOGEY 163!',
          lines: [{ text: 'NEVER throw center-board on 228, 268 or 308 — 25 leaves bogey 163!', kind: 'warn' }] });
        completeChallenge(false, `Trap! Hitting 25 on ${it.rem} leaves BOGEY 163! Throw ${it.cover} -> 170!`);
      } else {
        throwDartTo(x, y, { kind: bed.ring });
        state.dartsLeft = 0;
        const lv = it.rem - bed.value;
        completeChallenge(true, `Safe center-board cover (${lv} left)! Teen Cover ${it.cover} leaves ${it.targetLeave}.`,
          [{ text: `${bed.code} leaves ${lv} (safe!)`, kind: 'ok' }, it.cue]);
      }
    } else {
      const lv = it.rem - bed.value;
      throwDartTo(x, y, { kind: bed.ring, wireTink: true });
      applyChallengeHint(false);
      if (BOGEY_NUMBERS.has(lv)) {
        renderChalkboard({ header: 'BOGEY LEFT!', big: lv, sub: `${lv} is uncheckoutable!`, lines: [{ text: it.cue, kind: 'warn' }] });
        completeChallenge(false, `Ouch! ${bed.code} leaves BOGEY ${lv}! ${it.cue}`);
      } else {
        completeChallenge(false, `${bed.code} leaves ${lv}. Use the Teen Cover Shot: ${it.cover} -> ${it.targetLeave}!`);
      }
    }
  }
}

function submitNumericAnswer(rawStr) {
  const ch = state.challenge;
  if (!ch || state.busy) return;
  const val = parseInt(rawStr, 10);
  if (Number.isNaN(val)) return;

  if (ch.kind === 'double_val' || ch.kind === 'treble_val') {
    if (val === ch.val) {
      showNumpad(false);
      completeChallenge(true, `Instant! ${ch.cue}`, [{ text: ch.cue, kind: 'ok' }]);
    } else {
      applyChallengeHint(false);
      state.numInput = ''; renderNumpadDisplay();
      completeChallenge(false, `${val} isn't right — ${ch.cue}`);
    }
    return;
  }

  if (ch.missPrompt) {
    if (val === ch.missAns) {
      showNumpad(false);
      ch.missPrompt = false;
      completeChallenge(true, `Locked in! ${ch.item.score} (${ch.item.route.join(' ')}) · Miss -> ${ch.missAns}`,
        [{ text: `${ch.item.score} + Miss ${ch.missAns}`, kind: 'ok' }, ch.item.cue]);
    } else {
      state.numInput = ''; renderNumpadDisplay();
      completeChallenge(false, `Check subtraction: ${ch.item.score} - ${bedValue('S' + ch.item.route[0].slice(1))} = ${ch.missAns}`);
    }
    return;
  }

  if (ch.kind === 'marking') {
    const it = ch.item;
    if (val === it.total) {
      elScoreBig.textContent = String(it.total);
      showNumpad(false);
      applyChallengeHint(true); // flash visual grouping briefly as reinforcement!
      completeChallenge(true, `GAME ON! ${it.total} — ${it.cue}`, [{ text: `Called ${it.total}!`, kind: 'ok' }, it.cue]);
    } else {
      applyChallengeHint(false);
      state.numInput = ''; renderNumpadDisplay();
      completeChallenge(false, `Not ${val}! Group the amber darts first: ${it.cue}`);
    }
  }
}

/* ---------- Self-Playing "Oche Ghost" Autopilot ---------- */
function tickGhost(dt) {
  if (!state.ghostMode || state.busy || !state.challenge) return;
  state.ghostTimer += dt;
  const ch = state.challenge;

  // Give viewers ~1.5s to read the slate & board before Ghost acts
  if (state.ghostTimer < 1.55) return;
  state.ghostTimer = 0;

  if (ch.kind === 'double_find' || ch.kind === 'treble_find' || ch.kind === 'halving') {
    handleBoardClick({ code: ch.target, ring: ch.target[0], value: bedValue(ch.target) });
  } else if (ch.kind === 'double_val' || ch.kind === 'treble_val') {
    submitNumericAnswer(String(ch.val));
  } else if (ch.kind === 'below60') {
    const code = state.stepIndex === 0 ? ch.item.setup[0] : 'D' + (state.remainingScore / 2);
    handleBoardClick({ code, ring: code[0], value: bedValue(code), sub: 'OS' });
  } else if (ch.kind === 'g44') {
    const code = state.stepIndex === 0 ? ch.item.route[0] : (state.remainingScore === 50 ? 'BULL' : 'D' + (state.remainingScore / 2));
    handleBoardClick({ code, ring: code === 'BULL' ? 'BULL' : code[0], value: bedValue(code), sub: 'OS' });
  } else if (ch.kind === 'sods') {
    if (state.stepIndex === 0) {
      const code = ch.item.valid[0];
      handleBoardClick({ code, ring: code === 'BULL' ? 'BULL' : code[0], value: bedValue(code) });
    } else {
      // Pick clean setup after Sod's Law miss
      const rem = state.remainingScore;
      const pick = rem === 68 ? 'T16' : rem === 74 ? 'T14' : rem === 66 ? 'T10' : rem === 60 ? 'S20' : rem === 58 ? 'S18' : 'S' + (rem - 32);
      const code = bedValue(pick) > 0 && rem - bedValue(pick) >= 8 ? pick : 'S20';
      handleBoardClick({ code, ring: code[0], value: bedValue(code) });
    }
  } else if (ch.kind === 'tonplus') {
    const it = ch.item;
    let code;
    if (state.stepIndex === 0) code = it.open[0];
    else if (state.stepIndex === 1) {
      const g = G44_BY_SCORE[state.remainingScore];
      code = g ? g.route[0] : it.next[0];
    } else code = state.remainingScore === 50 ? 'BULL' : 'D' + (state.remainingScore / 2);
    handleBoardClick({ code, ring: code === 'BULL' ? 'BULL' : code[0], value: bedValue(code) });
  } else if (ch.kind === 'bogey') {
    const code = ch.item.cover;
    handleBoardClick({ code, ring: 'S', value: bedValue(code) });
  } else if (ch.kind === 'marking') {
    submitNumericAnswer(String(ch.item.total));
  }
}

function claimPlayerControl() {
  state.lastPlayerInputAt = performance.now();
  if (state.ghostMode) {
    state.ghostMode = false;
    updateHudStats();
    setFeedback('You have the darts! Click the 3D board or type scores.', 'cue');
  }
}

/* ============================================================================
   11. RAYCASTING, INPUTS & CHALKBOARD DRAWER (STAGES + MASTERY LEDGER)
   ============================================================================ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

function raycastBoard(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(boardFace, false);
  if (!hits.length) return null;
  const pt = hits[0].point;
  const bed = xyToBed(pt.x, pt.y);
  return bed ? { bed, pt } : null;
}

canvas.addEventListener('pointermove', (e) => {
  const hit = raycastBoard(e.clientX, e.clientY);
  updateHoverBed(hit ? hit.bed : null);
});

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const hit = raycastBoard(e.clientX, e.clientY);
  if (!hit) return;
  claimPlayerControl();
  handleBoardClick(hit.bed, hit.pt);
});

// Keyboard support (Digits, Enter, Backspace, H=Cue, N=Next, L=Ledger)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (elDrawerBg.classList.contains('open')) return;
  if (e.key >= '0' && e.key <= '9') {
    if (elNumpad.classList.contains('visible')) {
      claimPlayerControl();
      if (state.numInput.length < 3) { state.numInput += e.key; renderNumpadDisplay(); }
    }
  } else if (e.key === 'Backspace' && elNumpad.classList.contains('visible')) {
    claimPlayerControl();
    state.numInput = state.numInput.slice(0, -1); renderNumpadDisplay();
  } else if (e.key === 'Enter' && elNumpad.classList.contains('visible')) {
    claimPlayerControl();
    submitNumericAnswer(state.numInput);
  } else if (e.key.toLowerCase() === 'h') {
    claimPlayerControl(); applyChallengeHint(false);
  } else if (e.key.toLowerCase() === 'n') {
    claimPlayerControl(); loadChallenge(nextChallengeForStage(state.stage));
  } else if (e.key.toLowerCase() === 'l') {
    openDrawer('ledger');
  }
});

// Slate Numpad clicks

});
