  }
});
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
elDrawerBg.addEventListener('click', (e) => { if (e.target === elDrawerBg) closeDrawer(); });

elSoundPill.addEventListener('click', () => {
  const on = audio.toggle();
  elSoundPill.textContent = on ? 'Sound: On' : 'Sound: Off';
  elSoundPill.classList.toggle('on', on);
  if (on) audio.playBell('ok');
});

let drawerTab = 'stages';
document.querySelectorAll('.dtab').forEach(tab => {
  tab.addEventListener('click', () => {
    drawerTab = tab.dataset.tab;
    document.querySelectorAll('.dtab').forEach(t => t.classList.toggle('active', t.dataset.tab === drawerTab));
    renderDrawer();
  });
});

function openDrawer(tab = 'stages') {
  drawerTab = tab;
  document.querySelectorAll('.dtab').forEach(t => t.classList.toggle('active', t.dataset.tab === drawerTab));
  elDrawerBg.classList.add('open');
  renderDrawer();
}
function closeDrawer() { elDrawerBg.classList.remove('open'); }

function stageProgressPct(stageId) {
  let ids = [];
  if (stageId === 'STAGE_0A') ids = [...SECTORS.map(s => 'D' + s), 'BULL'];
  else if (stageId === 'STAGE_0B') ids = ESSENTIAL_TREBLES.map(n => 'T' + n);
  else if (stageId === 'STAGE_1') ids = BELOW_60_ITEMS.map(x => x.id);
  else if (stageId === 'STAGE_2') ids = GOLDEN_44.map(x => 'G44_' + x.score);
  else if (stageId === 'STAGE_3') ids = SODS_LAW_ITEMS.map(x => x.id);
  else if (stageId === 'STAGE_4') ids = TON_PLUS_ITEMS.map(x => x.id);
  else if (stageId === 'STAGE_5') ids = BOGEY_ITEMS.map(x => x.id);
  else if (stageId === 'STAGE_6') ids = MARKING_ITEMS.map(x => x.id);
  else return 0;
  const ok = ids.filter(id => mastery.get(id).ok >= 1).length;
  return Math.round((ok / ids.length) * 100);
}

function renderDrawer() {
  if (drawerTab === 'stages') {
    elDrawerBody.innerHTML = `
      <div class="setting-row">
        <span>Chalk Scaffolding</span>
        <div class="seg-group">
          <button class="seg-btn ${state.hintMode === 'auto' ? 'active' : ''}" data-hint="auto">Auto-Fade</button>
          <button class="seg-btn ${state.hintMode === 'always' ? 'active' : ''}" data-hint="always">Guided</button>
          <button class="seg-btn ${state.hintMode === 'blind' ? 'active' : ''}" data-hint="blind">Match Blind</button>
        </div>
      </div>
      <div class="setting-row">
        <span>Match-Night Rival Pressure</span>
        <div class="seg-group">
          <button class="seg-btn ${state.rivalPressure ? 'active' : ''}" data-rival="1">Rival on D16</button>
          <button class="seg-btn ${!state.rivalPressure ? 'active' : ''}" data-rival="0">Practice</button>
        </div>
      </div>
      ${STAGES.map(st => {
        const pct = stageProgressPct(st.id);
        return `
          <div class="stage-card ${state.stage === st.id ? 'selected' : ''}" data-stage="${st.id}">
            <div class="sc-top">
              <div class="sc-title">${st.title}</div>
              <span class="sc-tag">${st.tag}${st.id !== 'CALIBRATION' ? ` · ${pct}%` : ''}</span>
            </div>
            <div class="sc-desc">${st.desc}</div>
            ${st.id !== 'CALIBRATION' ? `<div class="sc-bar"><div class="sc-fill" style="width:${pct}%"></div></div>` : ''}
          </div>
        `;
      }).join('')}
    `;
    elDrawerBody.querySelectorAll('[data-hint]').forEach(b => b.addEventListener('click', () => {
      state.hintMode = b.dataset.hint; renderDrawer(); loadChallenge(nextChallengeForStage(state.stage));
    }));
    elDrawerBody.querySelectorAll('[data-rival]').forEach(b => b.addEventListener('click', () => {
      state.rivalPressure = b.dataset.rival === '1'; renderDrawer();
    }));
    elDrawerBody.querySelectorAll('[data-stage]').forEach(card => card.addEventListener('click', () => {
      claimPlayerControl();
      state.stage = card.dataset.stage;
      if (state.stage === 'CALIBRATION') { state.calibQueue = []; state.calibIndex = 0; }
      closeDrawer();
      loadChallenge(nextChallengeForStage(state.stage));
    }));
  } else {
    // Mastery Ledger
    const acc = mastery.data.totalAttempts ? Math.round((mastery.data.totalCorrect / mastery.data.totalAttempts) * 100) : 0;
    const avg = mastery.avgMs();
    const cell = (id, label, sub, speedMs = 2800) => {
      const cls = mastery.badge(id, speedMs);
      const st = mastery.get(id);
      const rt = st.bestMs < 90000 ? `${(st.bestMs / 1000).toFixed(1)}s` : sub;
      return `<div class="l-cell ${cls}">${label}<span class="l-sub">${rt}</span></div>`;
    };
    elDrawerBody.innerHTML = `
      <div class="summary-banner">
        <strong>Session & Rolodex Stats:</strong> ${mastery.data.totalCorrect}/${mastery.data.totalAttempts} hits (${acc}%) ·
        Best Flow: <strong>${mastery.data.bestStreak}</strong> · Avg Speed: <strong>${avg ? (avg/1000).toFixed(2)+'s' : '—'}</strong><br/>
        <span style="opacity:0.75">Dim Chalk = Unseen · Warm Amber = Learning · Burnished Brass = Mastered (&lt;2.8s)</span>
      </div>
      <div class="ledger-section-title"><span>10 Essential Trebles</span><span>Target &lt;2.0s</span></div>
      <div class="ledger-grid">${ESSENTIAL_TREBLES.map(n => cell('T' + n, 'T' + n, String(n * 3), 2100)).join('')}</div>

      <div class="ledger-section-title"><span>All Doubles & Bull</span><span>Target &lt;2.2s</span></div>
      <div class="ledger-grid">${[...SECTORS.map(s => cell('D' + s, 'D' + s, String(s * 2), 2300)), cell('BULL', 'BULL', '50', 2300)].join('')}</div>

      <div class="ledger-section-title"><span>The Golden 44</span><span>Target &lt;3.0s</span></div>
      <div class="ledger-grid">${GOLDEN_44.slice().sort((a,b) => a.score - b.score).map(g => cell('G44_' + g.score, String(g.score), g.route[0], 3000)).join('')}</div>

      <div class="ledger-section-title"><span>Croupier Core Shapes</span><span>Target &lt;3.2s</span></div>
      <div class="ledger-grid">${MARKING_ITEMS.slice(0, 18).map(m => cell(m.id, String(m.total), m.darts[0], 3200)).join('')}</div>

      <button id="reset-mastery-btn" class="hud-btn" style="align-self:flex-start;margin-top:6px;border-color:rgba(184,66,57,0.6);color:#f0a8a2">Reset Progress</button>
    `;
    document.getElementById('reset-mastery-btn').addEventListener('click', () => {
      mastery.reset(); updateHudStats(); renderDrawer();
    });
  }
}

/* ============================================================================
   12. ANIMATION LOOP (60FPS, LAMP FLICKER, CAMERA BREATH, DUST & POST-PROCESS)
   ============================================================================ */
let cameraKick = 0;
let lastTime = performance.now();
let clockSec = 0;
const curCamPos = BASE_CAM.clone();
const curLookAt = BASE_LOOK.clone();

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  // Frame full board (with 20 completely clear below HUD) + entire right 3D slate chalkboard cleanly
  const aspectPad = Math.max(0, 1.55 - camera.aspect) * 3.2;
  const wide = camera.aspect >= 1.15;
  BASE_CAM.set(wide ? 0.92 : 0.22, 0.44, 10.65 + aspectPad);
  BASE_LOOK.set(wide ? 0.86 : 0.14, 0.22, 0);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (postRT) postRT.dispose();
  postRT = createPostTarget(w, h);
  postMat.uniforms.tDiffuse.value = postRT.texture;
  postMat.uniforms.tDepth.value = postRT.depthTexture;
  postMat.uniforms.uResolution.value.set(postRT.width, postRT.height);
}
window.addEventListener('resize', onResize);
onResize();

// Start immediately with Oche Ghost demonstrating a live Golden 44 / Ton-Plus / Marking showcase!
const GHOST_ROTATION = ['STAGE_4', 'STAGE_2', 'STAGE_6', 'STAGE_3', 'STAGE_5', 'STAGE_1'];
let ghostRotIdx = 0;
state.stage = 'STAGE_2';
loadChallenge(nextChallengeForStage('STAGE_2'));

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  clockSec += dt;

  // Return seamlessly to Oche Ghost after 14s of player inactivity (when drawer closed)
  if (!state.ghostMode && !elDrawerBg.classList.contains('open') && now - state.lastPlayerInputAt > 14000) {
    state.ghostMode = true;
    ghostRotIdx = (ghostRotIdx + 1) % GHOST_ROTATION.length;
    state.stage = GHOST_ROTATION[ghostRotIdx];
    updateHudStats();
    setFeedback('Oche Ghost resumed — click any 3D bed anytime to take over.', 'cue');
    loadChallenge(nextChallengeForStage(state.stage));
  }

  // Auto-fade Hint-on-Hesitation (Tier 2): gently reveal rescue cue after 3.4s pause!
  if (!state.ghostMode && !state.busy && state.challenge && !state.hintShown && state.hintMode === 'auto') {
    const id = challengeItemId(state.challenge);
    const tier = mastery.tier(id, state.challenge.speedMs || 3000);
    if (tier === 2 && now - state.challengeStartMs > 3400) {
      applyChallengeHint(true);
    }
  }

  // Speed/Flow bar update
  if (state.challenge && !state.busy) {
    const targetMs = (state.challenge.speedMs || 3200) * (state.ghostMode ? 2.2 : 1.4);
    const elapsed = now - state.challengeStartMs;
    const pct = Math.max(0, 1 - elapsed / targetMs);
    elTimerFill.style.transform = `scaleX(${pct})`;
    elTimerFill.className = 'timer-fill' + (pct < 0.25 ? ' urgent' : pct < 0.5 ? ' warn' : '');
  }

  // Subtle organic tungsten lamp warmth + Oche Flow boost (balanced, even illumination!)
  const flowBoost = Math.min(1, mastery.data.streak / 8);
  const flicker = 1 + Math.sin(clockSec * 7.3) * 0.012 + Math.sin(clockSec * 19.7) * 0.007;
  mainSpot.intensity = (42 + flowBoost * 8) * flicker;
  boardLowerFill.intensity = (18.0 + flowBoost * 3.0) * flicker;
  slateLight.intensity = (24.0 + flowBoost * 3.5) * flicker;
  postMat.uniforms.uFlowBoost.value = flowBoost;
  postMat.uniforms.uTime.value = clockSec;

  // Gently pulse highlighted target beds on the 3D board so cues read effortlessly
  for (const ch of overlayGroup.children) {
    if (ch.userData && ch.userData.pulse && ch.material) {
      ch.material.opacity = ch.userData.baseOp * (0.78 + 0.24 * Math.sin(clockSec * 4.5));
    }
  }

  // Gentle oche camera breathing & subtle dart-impact kick
  cameraKick *= Math.exp(-dt * 12);
  const targetCam = BASE_CAM.clone();
  targetCam.x += Math.sin(clockSec * 0.42) * 0.07;
  targetCam.y += Math.cos(clockSec * 0.55) * 0.045 - cameraKick;
  // Slightly lean toward right slate chalkboard during Marking mode
  if (state.challenge && state.challenge.kind === 'marking') {
    targetCam.x += 0.22;
    targetCam.z -= 0.18;
  }
  curCamPos.lerp(targetCam, 1 - Math.exp(-dt * 3.5));
  camera.position.copy(curCamPos);
  camera.lookAt(curLookAt);
  postMat.uniforms.uFocusDepth.value = camera.position.z;

  // Drift chalk dust motes in the warm lamp beam
  const dArr = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST_COUNT; i++) {
    const v = dustVel[i];
    dArr[i * 3]     += (v.vx + Math.sin(clockSec * 0.7 + v.ph) * 0.025) * dt;
    dArr[i * 3 + 1] += v.vy * dt;
    if (dArr[i * 3 + 1] > 2.8) {
      dArr[i * 3 + 1] = -2.6;
      dArr[i * 3] = (Math.random() - 0.5) * 6.2;
    }
  }
  dustGeo.attributes.position.needsUpdate = true;

  // Update impact chalk/spark bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.age += dt;
    if (b.age >= b.life) {
      scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose();
      bursts.splice(i, 1); continue;
    }
    const arr = b.pts.geometry.attributes.position.array;
    for (let k = 0; k < b.vels.length; k++) {
      b.vels[k].vy -= 2.2 * dt;
      arr[k * 3]     += b.vels[k].vx * dt;
      arr[k * 3 + 1] += b.vels[k].vy * dt;
      arr[k * 3 + 2] += b.vels[k].vz * dt;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    b.pts.material.opacity = 0.85 * (1 - b.age / b.life);
  }

  updateDarts(dt);
  tickGhost(dt);

  // Pass 1: Render 3D scene to reduced-res target with DepthTexture
  renderer.setRenderTarget(postRT);
  renderer.render(scene, camera);

  // Pass 2: Full-screen depth tilt-shift + subtle Bayer dither + vignette + film grain
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

requestAnimationFrame(animate);
</script>
